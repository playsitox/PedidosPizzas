<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza por encargo Colegio Los Ceibos</title>
<style>
:root{--bg:#f8f5f0;--card:#fff;--text:#1d3557;--muted:#6c757d;--border:#e0e0e0;--primary:#2d6a4f;--accent:#e76f51;--note:#fff3cd;--notet:#856404;--wa:#25D366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1e2b24;--text:#e8efe9;--muted:#9fb0a5;--border:#33443a;--primary:#6fcf97;--note:#3a3320;--notet:#f0d98a}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1e2b24;--text:#e8efe9;--muted:#9fb0a5;--border:#33443a;--primary:#6fcf97;--note:#3a3320;--notet:#f0d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:12px}
.w{max-width:720px;margin:0 auto}
.hero{border-radius:16px;overflow:hidden;margin-bottom:14px}
.hero img{width:100%;max-height:300px;object-fit:contain;display:block;background:#f5e6d3}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{font-size:clamp(.78rem,4vw,1.1rem);white-space:nowrap;margin-bottom:10px}h2{font-size:1.05rem;color:var(--primary);margin-bottom:10px}
.note{background:var(--note);color:var(--notet);padding:10px 12px;border-radius:10px;font-size:.9rem;margin-bottom:8px}
.p{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.p:last-of-type{border:0}.p b{display:block}.p small{color:var(--muted)}
.pr{color:var(--accent);font-weight:700;white-space:nowrap}
.q{display:flex;align-items:center;gap:8px}
.q button{width:34px;height:34px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.2rem;cursor:pointer}
.q span{min-width:20px;text-align:center;font-weight:700}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;background:var(--card);color:var(--text);font-family:inherit}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin-top:12px}
.btn,.btn2{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
.btn{background:var(--wa);color:#fff}.btn2{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.err{color:#e74c3c;font-size:.85rem;margin-top:8px}
.pago{text-align:center;border:2px dashed var(--primary);border-radius:12px;padding:14px;margin:12px 0}
.al{font-size:1.5rem;font-weight:800;color:var(--primary);word-break:break-all}
ol{padding-left:20px;font-size:.9rem;margin-top:8px}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--border)}
.ar input:first-child,.ar input:nth-child(4),.ar button{grid-column:1/3}
.ar button{padding:6px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.g div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.g b{display:block;font-size:1.2rem}.g small{color:var(--muted)}
.o{padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
small{color:var(--muted)}
.btn{background:var(--primary)}
.sm{display:inline-block;width:auto;margin:8px 6px 0 0;padding:8px 12px;font-size:.85rem}
.red{border-color:var(--accent);color:var(--accent)}
.foot{text-align:center;color:var(--muted);font-size:.85rem;line-height:1.5;padding:14px 10px 10px}
:root{--c-pz:#3d5a80;--c-fa:#2a9d8f;--c-co:#e76f51;--c-ga:#2d6a4f;--c-ok:#c98a0b;--c-fo:#457b9d;--f-muzza:#d4a017;--f-especial:#d1543c;--f-roquefort:#4a7fb5;--f-x1:#2a9d8f;--f-x2:#2d6a4f;--f-x3:#8d6e63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-pz:#9db8e0;--c-fa:#5fd0c3;--c-co:#f4a08a;--c-ga:#6fcf97;--c-ok:#f0c15a;--c-fo:#8ab4d6;--f-muzza:#f0c15a;--f-especial:#f4a08a;--f-roquefort:#8ab4d6;--f-x1:#5fd0c3;--f-x2:#6fcf97;--f-x3:#c8a99a}.btn,.q button{color:#10281b}}
</style>
</head>

var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d}
function fd(d){return (typeof d==='string'?new Date(d+'T12:00:00'):d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}
function comp(s){var o={};String(s||'').split(',').forEach(function(x){var p=x.split(':'),k=p[0].trim();if(k)o[k]=(o[k]||0)+(parseInt(p[1],10)||1)});return o}
function desc(p){var o=comp(p.m);return Object.keys(o).map(function(k){return o[k]+' '+k}).join(' + ')}
function closed(){return !S.deadline||iso(new Date())>S.deadline}
function lines(){return S.products.filter(function(p){return Q[p.id]>0})}
function total(){var t=0;S.products.forEach(function(p){t+=(Q[p.id]||0)*p.p});return t}
function sv(){try{localStorage.setItem('pz_tk',JSON.stringify(TK))}catch(e){}}
function get(q){return fetch(SCRIPT_URL+'?'+q).then(function(r){return r.json()})}
function post(d){return fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(d)}).then(function(r){return r.json()})}
function info(){return S.deadline?'<div class="note">📅 Cierre de pedidos: <b>'+fd(S.deadline)+'</b></div><div class="note">🏫 Retiro: <b>'+fd(ad(S.deadline,4))+'</b> (fecha fijada de antemano, 4 días después del cierre). Solo retiro.</div>':'<div class="note">Pronto abrimos la próxima tanda de pedidos.</div>'}
function say(t){MSG=t;R();window.scrollTo(0,0)}
function loginCard(){return '<div class="card"><h2>🔧 Ingresar como admin</h2><label>Clave de administrador</label><input id="k" type="password" autocomplete="current-password" enterkeyhint="go" onkeydown="if(event.key===\'Enter\')login()"><button class="btn" style="background:var(--primary)" onclick="login()">Entrar</button></div>'}
function login(){KEY=($('k').value||'').trim();if(!KEY)return say('Escribí la clave.');say('Verificando…');loadAdmin()}
function R(){var h=S?(V==='shop'?shop():V==='cart'?cart():V==='pay'?pay():tk()):'<div class="card">'+(BAD?'<b>No pudimos cargar la página.</b><button class="btn2" onclick="init()">Reintentar</button>':'Cargando…')+'</div>';$('app').innerHTML=(MSG?'<div class="note"><b>'+esc(MSG)+'</b></div>':'')+(ON?'':'<div class="note">⚠️ Modo prueba: falta conectar la planilla (SCRIPT_URL). Los pedidos no se guardan.</div>')+(ADM?admin():(ASK?loginCard():''))+h+'<div class="foot">🍕💚 Cada pizza que pedís ayuda a que los chicos de 4° grado de la primaria puedan vivir su campamento. ¡Gracias por sumarte!</div>'}
function go(v){MSG='';if(v==='cart'&&!lines().length){MSG='Elegí al menos una pizza.';R();return}V=v;if(TK&&v!=='shop'&&v!=='cart'){TK.v=v;sv()}R();window.scrollTo(0,0)}
function m(id,d){MSG='';Q[id]=Math.max(0,Math.min(50,(Q[id]||0)+d));R()}
function shop(){var h='<div class="card"><h1>🍕 Pizza por encargo Colegio Los Ceibos</h1>'+info()+'</div>';
if(closed())return h+'<div class="card"><b>Los pedidos están cerrados por ahora.</b></div>';
return h+'<div class="card"><h2>Elegí tus pizzas</h2>'+S.products.map(function(p){return '<div class="p"><div><b>'+esc(p.n)+'</b><small>'+esc(desc(p))+'</small><div class="pr">'+f(p.p)+'</div></div><div class="q"><button onclick="m('+p.id+',-1)">−</button><span>'+(Q[p.id]||0)+'</span><button onclick="m('+p.id+',1)">+</button></div></div>'}).join('')+'<div class="tot"><span>Total</span><span>'+f(total())+'</span></div><button class="btn" onclick="go(\'cart\')">🛒 Ver carrito</button></div>'}
function cart(){return '<div class="card"><h2>🛒 Tu carrito</h2>'+lines().map(function(p){return '<div class="p"><b>'+Q[p.id]+'× '+esc(p.n)+'</b><div class="pr">'+f(Q[p.id]*p.p)+'</div></div>'}).join('')+'<div class="tot"><span>Total</span><span>'+f(total())+'</span></div></div><div class="card"><h2>Tus datos</h2><label>Nombre y apellido *</label><input value="'+esc(C.n)+'" oninput="C.n=this.value"><label>Teléfono / WhatsApp *</label><input type="tel" value="'+esc(C.t)+'" oninput="C.t=this.value"><label>Comentarios (opcional)</label><textarea rows="2" oninput="C.c=this.value">'+esc(C.c)+'</textarea><div class="err" id="e"></div><button class="btn" onclick="conf()">Confirmar pedido</button><button class="btn2" onclick="go(\'shop\')">← Seguir eligiendo</button></div>'}
function conf(){if(BUSY)return;var n=C.n.trim(),t=C.t.trim();if(!n||!t){$('e').textContent='Completá tu nombre y teléfono.';return}
var L=lines();C.id=C.id||'PZ-'+Math.random().toString(36).slice(2,6).toUpperCase();
var it=L.map(function(p){return[p.id,Q[p.id]]}),d={action:'order',id:C.id,n:n,t:t,c:C.c.trim(),it:it};
BUSY=true;$('e').textContent='Registrando tu pedido…';
(ON?post(d):Promise.resolve({ok:true,total:total()})).then(function(r){BUSY=false;if(!r.ok){$('e').textContent=r.error||'No se pudo registrar el pedido.';return}
TK={id:C.id,n:n,t:t,c:C.c.trim(),it:it,l:L.map(function(p){return[p.n,Q[p.id],p.p]}),total:r.total,d:fd(ad(S.deadline,4)),v:'pay'};sv();V='pay';R();window.scrollTo(0,0)}).catch(function(){BUSY=false;$('e').textContent='Sin conexión. Reintentá en unos segundos.'})}

function wa(){var msg='Hola! Te envío el comprobante de mi pago 🧾 (lo adjunto en este chat)\n\nTicket: '+TK.id+'\n'+TK.l.map(function(x){return '• '+x[1]+'× '+x[0]}).join('\n')+'\nTotal: '+f(TK.total)+'\nNombre: '+TK.n+'\nTeléfono: '+TK.t+'\nRetiro: '+TK.d;
TK.v='tk';TK.sent=1;sv();window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank');V='tk';R()}
function tk(){return '<div class="card"><h1>🎟️ Ticket '+TK.id+'</h1>'+TK.l.map(function(x){return '<div class="p"><b>'+x[1]+'× '+esc(x[0])+'</b><div class="pr">'+f(x[1]*x[2])+'</div></div>'}).join('')+'<div class="tot"><span>Total</span><span>'+f(TK.total)+'</span></div><p style="margin-top:10px"><b>'+esc(TK.n)+'</b> · '+esc(TK.t)+'</p><div class="note" style="margin-top:10px">🏫 Retiro: <b>'+esc(TK.d)+'</b></div><div class="note">'+(TK.sent?'🧾 Comprobante enviado por WhatsApp. Lo verificamos con este ticket.':'⏳ Falta enviar el comprobante de pago.')+'</div><button class="btn" onclick="wa()">📱 '+(TK.sent?'Reenviar':'Enviar')+' comprobante por WhatsApp</button><button class="btn2" onclick="go(\'pay\')">Ver datos de pago</button><button class="btn2" onclick="nuevo()">Hacer otro pedido</button></div>'}
function nuevo(){TK=null;Q={};C={n:'',t:'',c:'',id:''};try{localStorage.removeItem('pz_tk')}catch(e){}V='shop';R();window.scrollTo(0,0)}
var EDIT=-1,ED=null,DEL=-1;
function fcol(k){var n=k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),m={muzza:1,muzzarella:1,mozzarella:1,mozarella:1,especial:2,roquefort:3,roque:3},v=['','--f-muzza','--f-especial','--f-roquefort'];if(m[n])return 'var('+v[m[n]]+')';var h=0;for(var i=0;i<n.length;i++)h+=n.charCodeAt(i);return 'var(--f-x'+(h%3+1)+')'}
function flav(s){var k={};AC.products.forEach(function(p){Object.keys(comp(p.m)).forEach(function(x){k[x]=1})});Object.keys(s.fl).forEach(function(x){k[x]=1});return Object.keys(k)}
function stats(){var s={fl:{},pz:0,fa:0,co:0,ok:0,fo:0};AO.forEach(function(o){o.l.forEach(function(x){var c=comp(x.m);s.fa+=x.q*x.p;s.co+=x.q*x.c;Object.keys(c).forEach(function(k){s.pz+=x.q*c[k];s.fl[k]=(s.fl[k]||0)+x.q*c[k]})});if(o.ok){s.ok++;s.fo+=o.total}});return s}
function tile(v,l,c){return '<div><b style="color:var('+c+')">'+v+'</b><small>'+l+'</small></div>'}
function admin(){var s=stats(),h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><h2 style="margin:0">🔧 Modo admin</h2><button class="btn2 sm" style="margin:0" onclick="logout()">Salir</button></div><label>Fecha límite de pedidos</label><input type="date" value="'+esc(AC.deadline)+'" oninput="AC.deadline=this.value">'+(AC.deadline?'<small>Retiro fijado: '+fd(ad(AC.deadline,4))+'</small>':'')+'<h2 style="margin-top:16px">Variedades</h2><small>Nombre · precio · costo · contenido (Sabor:cantidad, ej. Muzza:1,Roquefort:1)</small>';
h+=AC.products.map(function(p,i){return '<div class="ar"><input value="'+esc(p.n)+'" oninput="AC.products['+i+'].n=this.value"><input type="number" value="'+p.p+'" oninput="AC.products['+i+'].p=+this.value"><input type="number" value="'+p.c+'" oninput="AC.products['+i+'].c=+this.value"><input value="'+esc(p.m)+'" oninput="AC.products['+i+'].m=this.value"><button onclick="delp('+i+')">🗑 Quitar</button></div>'}).join('')+'<button class="btn2" onclick="addp()">+ Agregar variedad</button><button class="btn" onclick="savecfg()">💾 Guardar fecha y variedades</button>';
h+='<h2 style="margin-top:16px">Resumen ('+AO.length+' pedidos)</h2><div class="g">'+tile(s.pz,'Pizzas','--c-pz')+tile(f(s.fa),'Facturado','--c-fa')+tile(f(s.co),'A pagar al proveedor','--c-co')+tile(f(s.fa-s.co),'Ganancia','--c-ga')+tile(s.ok+' / '+AO.length,'Pagos verificados','--c-ok')+tile(f(s.fo),'Cobrado verificado','--c-fo')+'</div><div class="g">'+flav(s).map(function(k){return '<div><b style="color:'+fcol(k)+'">'+(s.fl[k]||0)+'</b><small>'+esc(k)+'</small></div>'}).join('')+'</div>';
h+='<h2 style="margin-top:16px">Pedidos</h2><button class="btn2" onclick="loadAdmin()">🔄 Actualizar</button>'+AO.slice().reverse().map(function(o){return orow(o,AO.indexOf(o))}).join('')+'</div>';return h}
function orow(o,i){if(EDIT===i)return oedit(o,i);
var h='<div class="o"><b>'+esc(o.id)+'</b> · '+esc(o.n)+' · '+esc(o.t)+' · '+f(o.total)+'<br><small>'+o.l.map(function(x){return x.q+'× '+esc(x.n)}).join(', ')+(o.c?' · 💬 '+esc(o.c):'')+'</small><br><label style="display:inline;margin:0"><input type="checkbox" style="width:auto" '+(o.ok?'checked':'')+' onchange="setpaid('+i+',this.checked)"> Pago verificado</label><div><button class="btn2 sm" onclick="oedit0('+i+')">✏️ Editar pedido</button>';
h+=DEL===i?'<b style="font-size:.85rem">¿Borrar?</b> <button class="btn2 sm red" onclick="delo('+i+')">Sí, borrar</button><button class="btn2 sm" onclick="DEL=-1;R()">No</button>':'<button class="btn2 sm red" onclick="DEL='+i+';R()">🗑 Borrar pedido</button>';
return h+'</div></div>'}
function oedit0(i){var o=AO[i];ED={n:o.n,t:o.t,c:o.c||'',q:{},keep:[]};o.l.forEach(function(x){var p=AC.products.filter(function(y){return y.n===x.n})[0];if(p)ED.q[p.id]=(ED.q[p.id]||0)+x.q;else ED.keep.push(x)});EDIT=i;DEL=-1;R()}
function oedit(o,i){return '<div class="o"><b>'+esc(o.id)+'</b> · editando pedido<label>Nombre</label><input value="'+esc(ED.n)+'" oninput="ED.n=this.value"><label>Teléfono</label><input value="'+esc(ED.t)+'" oninput="ED.t=this.value"><label>Comentarios</label><input value="'+esc(ED.c)+'" oninput="ED.c=this.value">'+AC.products.map(function(p){return '<div class="p"><b>'+esc(p.n)+'</b><div class="q"><button onclick="eq('+p.id+',-1)">−</button><span>'+(ED.q[p.id]||0)+'</span><button onclick="eq('+p.id+',1)">+</button></div></div>'}).join('')+(ED.keep.length?'<small>Se conservan: '+ED.keep.map(function(x){return x.q+'× '+esc(x.n)}).join(', ')+' (variedad que ya no está en la lista)</small>':'')+'<small style="display:block">Al guardar se usan los precios vigentes.</small><button class="btn" onclick="esave('+i+')">💾 Guardar cambios del pedido</button><button class="btn2" onclick="EDIT=-1;R()">Cancelar</button></div>'}
function eq(id,d){ED.q[id]=Math.max(0,Math.min(50,(ED.q[id]||0)+d));R()}
function esave(i){var it=[];Object.keys(ED.q).forEach(function(id){if(ED.q[id]>0)it.push([+id,ED.q[id]])});
if(!ED.n.trim()||!ED.t.trim())return say('Nombre y teléfono no pueden quedar vacíos.');
if(!it.length&&!ED.keep.length)return say('El pedido necesita al menos una pizza (si no, borralo).');
post({action:'editOrder',key:KEY,id:AO[i].id,n:ED.n,t:ED.t,c:ED.c,it:it,keep:ED.keep}).then(function(r){if(!r.ok)return say('No se pudo guardar: '+(r.error||''));EDIT=-1;say('Pedido actualizado ✅');loadAdmin()}).catch(function(){say('Sin conexión. Reintentá.')})}
function delp(i){AC.products.splice(i,1);R()}
function addp(){AC.products.push({id:AC.nid++,n:'Nueva variedad',p:0,c:0,m:'Muzza:1'});R()}
function savecfg(){post({action:'saveConfig',key:KEY,cfg:AC}).then(function(r){if(!r.ok)return say('No se pudo guardar: '+(r.error||''));say('Guardado ✅');return get('action=config').then(function(c){S=c;R()})}).catch(function(){say('No se pudo conectar con la planilla')})}
function setpaid(i,v){AO[i].ok=v;post({action:'setPaid',key:KEY,id:AO[i].id,ok:v}).then(function(r){if(!r.ok){say('No se pudo guardar');loadAdmin()}else R()}).catch(function(){say('Sin conexión');loadAdmin()})}
function delo(i){var id=AO[i].id;DEL=-1;post({action:'delOrder',key:KEY,id:id}).then(function(r){if(r.ok){AO.splice(i,1);say('Pedido '+id+' borrado.')}else say('No se pudo borrar: '+(r.error||''))}).catch(function(){say('Sin conexión. Reintentá.')})}
function logout(){ADM=false;ASK=false;KEY='';AC=null;AO=[];EDIT=-1;DEL=-1;ED=null;try{sessionStorage.removeItem('pz_k')}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}MSG='Sesión de admin cerrada.';R();window.scrollTo(0,0)}
function loadAdmin(){post({action:'admin',key:KEY}).then(function(d){if(d.error){try{sessionStorage.removeItem('pz_k')}catch(e){}KEY='';return say(d.error==='bloqueado'?'Demasiados intentos. Esperá unos minutos y probá de nuevo.':d.error==='clave'?'Clave incorrecta.':'La clave llegó, pero el Apps Script no tiene la versión nueva. Revisá que la URL sea la de la implementación actualizada.')}try{sessionStorage.setItem('pz_k',KEY)}catch(e){}AC=d.cfg;AO=d.orders;ADM=true;if(MSG==='Verificando…')MSG='';R()}).catch(function(){say('No se pudo conectar con la planilla (Apps Script). Revisá la URL y que el acceso sea "Cualquier persona".')})}
function init(){BAD=false;if(!ON){S={deadline:'',nid:9,products:DEF};R();return}
R();
get('action=config').then(function(c){S=c;R()}).catch(function(){BAD=true;MSG='No pudimos leer la planilla. Revisá que la implementación de Apps Script esté como "Cualquier persona".';R()});
if(/[?&]admin\b/.test(location.search)&&!ASK){ASK=true;try{KEY=sessionStorage.getItem('pz_k')||''}catch(e){}if(KEY)loadAdmin();R()}}
init();
</script>
</body>
